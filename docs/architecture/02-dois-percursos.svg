<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="820" viewBox="0 0 1580 820" role="img" aria-labelledby="title desc">
<title id="title">Dois percursos, um núcleo de agentes</title>
<desc id="desc">A interface web acessa a API transacional, que usa PostgreSQL e armazenamento de anexos e chama o núcleo. Na coleta v4.4, o coletor lê os cenários, invoca o núcleo diretamente em subprocessos e grava respostas, eventos e consumo em arquivos. O núcleo usa ferramentas de FAQ, estoque e descritores de anexos e integra Amazon Bedrock para inferência.</desc>
