<title id="title">Camadas e pontos de adaptação</title>
<desc id="desc">A interface web e a extensão WhatsApp Web usam a API da aplicação. O coletor de cenários e parâmetros invoca o núcleo em subprocessos. O núcleo compartilha as estratégias de coordenação e acessa fontes de domínio e inferência Bedrock. A aplicação persiste dados em PostgreSQL e anexos em disco ou S3 compatível. O coletor salva os registros de pesquisa em arquivos.</desc>
