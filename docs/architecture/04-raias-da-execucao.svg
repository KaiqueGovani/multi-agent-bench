  <marker id="study-arrow" markerWidth="10" markerHeight="10" refX="8.3" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#17644f"/></marker>
</defs>
