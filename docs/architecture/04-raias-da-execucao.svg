<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">Percursos de execução do MAB em raias</title>
<desc id="desc">A aplicação interativa envia mensagens da interface web à API, que persiste dados e aciona o núcleo dos agentes. O coletor experimental invoca diretamente esse núcleo e grava artefatos locais. Em ambos os percursos, o núcleo usa fontes de domínio e Amazon Bedrock conforme a arquitetura.</desc>
<defs>
