  - id: "OQ-003"
    status: integrated
    created_at: "2026-08-20"
    created_by: "ralph_daily_run_2026-08-20-01"
    priority: high
    blocking: true
    target_sections:
      - "docs/tcc/method/experimental-protocol.md"
      - "4.4 Métricas de Avaliação"
    question: "Quantas repetições definitivas por combinação cenário-arquitetura e qual plano inferencial devem ser congelados antes dos experimentos?"
    recommendation: "Cinco repetições-piloto excluídas da análise final e tamanho definitivo fixado entre 10 e 30 antes da coleta, com comparações pareadas e correção de Holm."
    issue_number: 6
    issue_url: "https://github.com/KaiqueGovani/multi-agent-bench/issues/6"
    partial_context:
      status: "superseded_by_conclusive_response"
      summary: "A decisão havia sido adiada até a revisão metodológica."
      provided_by: "Kaique Govani"
      provided_at: "2026-08-23"
    response_summary: "Foram fixadas cinco repetições definitivas para cada combinação de 40 cenários e três arquiteturas, totalizando 600 execuções. A análise principal agregará repetições por cenário e arquitetura; para métricas contínuas ou ordinais sem pressuposto de normalidade, usará Friedman, seguido de Wilcoxon signed-rank com correção de Holm, α de 5% e tamanhos de efeito quando aplicáveis."
    answered_by: "Kaique Govani"
    answered_at: "2026-08-25"
    response_source: "4 METODOLOGIA — versão revisada.pdf"
    integrated_files:
      - "docs/tcc/manuscript/04-metodologia.md"
      - "docs/tcc/method/experimental-protocol.md"
      - "TCC/TCC_MAB_Facens_Ralph_10x.docx"
    integrated_at: "2026-08-25"

