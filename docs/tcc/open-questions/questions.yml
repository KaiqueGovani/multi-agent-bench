      provided_by: "Kaique Govani"
      provided_at: "2026-08-23"
    response_summary: "Alternativa C definida: LLM-as-Judge em todas as respostas, avaliação humana cega de 100% das respostas do estrato de revisão profissional e amostra estratificada de 20% das demais; o protocolo assume pelo menos um farmacêutico e registrará a ausência de concordância interavaliadores se somente um participar. O modelo do julgador será congelado na OQ-005."
    answered_by: "Kaique Govani"
    answered_at: "2026-08-25"
    response_source: "4 METODOLOGIA — versão revisada.pdf"
