<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#222222"/>
    </marker>
    <style>
      .title { font: 700 46px Arial, sans-serif; fill: #111111; }
      .subtitle { font: 400 27px Arial, sans-serif; fill: #3f3f3f; }
      .label { font: 700 30px Arial, sans-serif; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 400 24px Arial, sans-serif; fill: #222222; text-anchor: middle; dominant-baseline: middle; }
      .node { fill: #ffffff; stroke: #222222; stroke-width: 4; }
      .core { fill: #e8eef7; stroke: #222222; stroke-width: 5; }
      .edge { fill: none; stroke: #222222; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text class="title" x="800" y="78" text-anchor="middle">AGENTES COMO FERRAMENTAS</text>
  <text class="subtitle" x="800" y="122" text-anchor="middle">Coordenação centralizada por um agente orquestrador</text>

  <rect class="node" x="95" y="342" width="255" height="132" rx="20"/>
  <text class="label" x="222" y="390">USUÁRIO</text>
  <text class="small" x="222" y="433">solicitação</text>

  <rect class="core" x="540" y="306" width="520" height="205" rx="24"/>
  <text class="label" x="800" y="382">AGENTE ORQUESTRADOR</text>
  <text class="small" x="800" y="428">seleciona e aciona especialistas</text>

  <rect class="node" x="1210" y="175" width="300" height="125" rx="20"/>
  <text class="label" x="1350" y="224">AGENTE A</text>
  <text class="small" x="1350" y="264">pesquisa</text>
  <rect class="node" x="1210" y="355" width="300" height="125" rx="20"/>
  <text class="label" x="1350" y="404">AGENTE B</text>
  <text class="small" x="1350" y="444">recomendação</text>
  <rect class="node" x="1210" y="535" width="300" height="125" rx="20"/>
  <text class="label" x="1350" y="584">AGENTE C</text>
  <text class="small" x="1350" y="624">planejamento</text>

  <path class="edge" d="M350 387 H510"/>
  <path class="edge" d="M540 438 H380"/>
  <path class="edge" d="M1060 350 C1120 350 1135 237 1180 237"/>
  <path class="edge" d="M1210 277 C1145 277 1135 380 1090 380"/>
  <path class="edge" d="M1060 408 H1180"/>
  <path class="edge" d="M1210 447 H1090"/>
  <path class="edge" d="M1060 468 C1120 468 1135 597 1180 597"/>
  <path class="edge" d="M1210 637 C1145 637 1135 498 1090 498"/>

  <text class="subtitle" x="800" y="790" text-anchor="middle">Toda delegação e toda consolidação passam pelo orquestrador.</text>
</svg>
