<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#202020"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#777777"/>
    </marker>
    <style>
      .title { font: 700 48px Arial, sans-serif; fill: #111111; text-anchor: middle; }
      .subtitle { font: 400 27px Arial, sans-serif; fill: #444444; text-anchor: middle; }
      .panel-title { font: 700 31px Arial, sans-serif; fill: #111111; }
      .panel-note { font: 400 23px Arial, sans-serif; fill: #4a4a4a; }
      .node-title { font: 700 24px Arial, sans-serif; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
      .node-text { font: 400 20px Arial, sans-serif; fill: #222222; text-anchor: middle; dominant-baseline: middle; }
      .tiny { font: 400 18px Arial, sans-serif; fill: #555555; text-anchor: middle; }
      .panel { fill: #fafafa; stroke: #222222; stroke-width: 3; }
      .node { fill: #ffffff; stroke: #222222; stroke-width: 3; }
      .control { fill: #dfe8f4; stroke: #222222; stroke-width: 4; }
      .selected { fill: #e2f2ea; stroke: #222222; stroke-width: 4; }
      .muted { fill: #f1f1f1; stroke: #777777; stroke-width: 2.5; }
      .request { fill: #fff7df; stroke: #222222; stroke-width: 3; }
      .response { fill: #e8f1fb; stroke: #222222; stroke-width: 3; }
      .edge { fill: none; stroke: #202020; stroke-width: 4; marker-end: url(#arrow); }
      .edge-muted { fill: none; stroke: #777777; stroke-width: 3; stroke-dasharray: 11 9; marker-end: url(#arrow-muted); }
      .edge-two { fill: none; stroke: #202020; stroke-width: 3.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1500" fill="#ffffff"/>
  <text class="title" x="900" y="68">COMPARAÇÃO ENTRE ARQUITETURAS DE COORDENAÇÃO</text>
  <text class="subtitle" x="900" y="112">A mesma solicitação de estoque percorre estruturas de controle diferentes</text>

  <!-- Painel A -->
  <rect class="panel" x="45" y="145" width="1710" height="370" rx="24"/>
  <text class="panel-title" x="82" y="195">A  ORQUESTRAÇÃO CENTRALIZADA</text>
  <text class="panel-note" x="82" y="228">O supervisor decide a rota, aciona a ferramenta e consolida a resposta.</text>

  <rect class="request" x="82" y="285" width="285" height="125" rx="18"/>
  <text class="node-title" x="224" y="323">SOLICITAÇÃO</text>
  <text class="node-text" x="224" y="361">“Há o produto em estoque?”</text>
  <rect class="control" x="480" y="270" width="340" height="155" rx="20"/>
  <text class="node-title" x="650" y="322">SUPERVISOR</text>
  <text class="node-text" x="650" y="361">classifica, seleciona e integra</text>
  <rect class="muted" x="970" y="235" width="220" height="78" rx="16"/>
  <text class="node-title" x="1080" y="275">FAQ</text>
  <rect class="selected" x="970" y="325" width="220" height="78" rx="16"/>
  <text class="node-title" x="1080" y="365">ESTOQUE</text>
  <rect class="muted" x="970" y="415" width="220" height="78" rx="16"/>
  <text class="node-title" x="1080" y="455">ANEXOS</text>
  <rect class="response" x="1390" y="285" width="285" height="125" rx="18"/>
  <text class="node-title" x="1532" y="323">RESPOSTA</text>
  <text class="node-text" x="1532" y="361">evidência consolidada</text>
  <path class="edge" d="M367 347 H450"/>
  <path class="edge" d="M820 347 H940"/>
  <path class="edge-muted" d="M820 305 C885 305 890 274 940 274"/>
  <path class="edge-muted" d="M820 390 C885 390 890 454 940 454"/>
  <path class="edge" d="M1190 364 C1270 364 1280 347 1360 347"/>

  <!-- Painel B -->
  <rect class="panel" x="45" y="545" width="1710" height="350" rx="24"/>
  <text class="panel-title" x="82" y="595">B  <tspan font-style="italic">WORKFLOW</tspan> ESTRUTURADO</text>
  <text class="panel-note" x="82" y="628">A ordem das etapas define o caminho; cada saída alimenta a etapa seguinte.</text>

  <rect class="request" x="82" y="685" width="285" height="125" rx="18"/>
  <text class="node-title" x="224" y="723">SOLICITAÇÃO</text>
  <text class="node-text" x="224" y="761">“Há o produto em estoque?”</text>
  <rect class="node" x="445" y="685" width="220" height="125" rx="18"/>
  <text class="node-title" x="555" y="723">1. CLASSIFICAR</text>
  <text class="node-text" x="555" y="761">identificar intenção</text>
  <rect class="selected" x="745" y="685" width="220" height="125" rx="18"/>
  <text class="node-title" x="855" y="723">2. CONSULTAR</text>
  <text class="node-text" x="855" y="761">obter evidência</text>
  <rect class="node" x="1045" y="685" width="220" height="125" rx="18"/>
  <text class="node-title" x="1155" y="723">3. REVISAR</text>
  <text class="node-text" x="1155" y="761">verificar retorno</text>
  <rect class="response" x="1345" y="685" width="285" height="125" rx="18"/>
  <text class="node-title" x="1487" y="723">4. SINTETIZAR</text>
  <text class="node-text" x="1487" y="761">produzir resposta</text>
  <path class="edge" d="M367 747 H415"/>
  <path class="edge" d="M665 747 H715"/>
  <path class="edge" d="M965 747 H1015"/>
  <path class="edge" d="M1265 747 H1315"/>
  <text class="tiny" x="900" y="854">sequência explícita • dependências estáveis • transições observáveis</text>

  <!-- Painel C -->
  <rect class="panel" x="45" y="925" width="1710" height="405" rx="24"/>
  <text class="panel-title" x="82" y="975">C  <tspan font-style="italic">SWARM</tspan> DESCENTRALIZADO</text>
  <text class="panel-note" x="82" y="1008">Os agentes podem transferir a tarefa entre pares; o sintetizador encerra o atendimento.</text>

  <rect class="request" x="82" y="1080" width="285" height="125" rx="18"/>
  <text class="node-title" x="224" y="1118">SOLICITAÇÃO</text>
  <text class="node-text" x="224" y="1156">“Há o produto em estoque?”</text>
  <rect class="control" x="445" y="1080" width="245" height="125" rx="62"/>
  <text class="node-title" x="567" y="1118">COORDENADOR</text>
  <text class="node-text" x="567" y="1156">inicia o fluxo</text>
  <rect class="selected" x="790" y="1050" width="245" height="125" rx="62"/>
  <text class="node-title" x="912" y="1088">ESPECIALISTA</text>
  <text class="node-text" x="912" y="1126">estoque</text>
  <rect class="muted" x="790" y="1200" width="245" height="82" rx="41"/>
  <text class="node-title" x="912" y="1242">OUTRO ESPECIALISTA</text>
  <rect class="node" x="1135" y="1080" width="245" height="125" rx="62"/>
  <text class="node-title" x="1257" y="1118">SINTETIZADOR</text>
  <text class="node-text" x="1257" y="1156">consolida o contexto</text>
  <rect class="response" x="1480" y="1080" width="230" height="125" rx="18"/>
  <text class="node-title" x="1595" y="1118">RESPOSTA</text>
  <text class="node-text" x="1595" y="1156">atendimento final</text>
  <path class="edge" d="M367 1142 H415"/>
  <path class="edge" d="M690 1142 H760"/>
  <path class="edge" d="M1035 1112 C1080 1112 1080 1142 1105 1142"/>
  <path class="edge" d="M1380 1142 H1450"/>
  <path class="edge" d="M890 1175 V1192"/>
  <path class="edge" d="M935 1200 V1183"/>
  <text class="tiny" x="912" y="1303"><tspan font-style="italic">handoff</tspan> possível entre especialistas</text>

  <!-- Legenda -->
  <rect class="request" x="220" y="1380" width="70" height="38" rx="9"/>
  <text class="panel-note" x="307" y="1408">entrada comum</text>
  <rect class="control" x="550" y="1380" width="70" height="38" rx="9"/>
  <text class="panel-note" x="637" y="1408">controle da arquitetura</text>
  <rect class="selected" x="1030" y="1380" width="70" height="38" rx="9"/>
  <text class="panel-note" x="1117" y="1408">componente acionado</text>
  <rect class="response" x="1430" y="1380" width="70" height="38" rx="9"/>
  <text class="panel-note" x="1517" y="1408">saída</text>
  <text class="subtitle" x="900" y="1470">Elaboração própria com base na fundamentação teórica e nos padrões documentados do Strands Agents.</text>
</svg>
