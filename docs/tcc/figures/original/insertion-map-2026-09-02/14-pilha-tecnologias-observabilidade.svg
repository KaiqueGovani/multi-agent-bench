<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Pilha tecnológica e observabilidade</title>
<desc id="desc">Camadas tecnológicas verificadas no repositório e fluxo sanitizado de observabilidade.</desc>
<defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#536B7A"/>
              </marker>
              <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F80ED"/>
              </marker>
              <style>
                text { font-family: Arial, Helvetica, sans-serif; }
                .title { font-size: 38px; font-weight: 700; fill: #183B56; }
                .subtitle { font-size: 20px; fill: #5F7280; }
                .label { font-size: 22px; font-weight: 700; }
                .body { font-size: 18px; }
                .small { font-size: 15px; }
                .tiny { font-size: 13px; }
              </style>
            </defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="58" y="42" width="10" height="52" rx="5" fill="#2F80ED"/>
<text x="88" y="78" class="title">Pilha tecnológica e observabilidade</text>
<text x="88" y="112" class="subtitle">A aplicação separa apresentação, API, execução de agentes, dados e sinais operacionais.</text>
<rect x="65" y="180" width="950" height="105" rx="18" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<rect x="65" y="180" width="245" height="105" rx="18" fill="#EAF3FF"/>
<rect x="292" y="180" width="18" height="105" fill="#EAF3FF"/>
<text x="188" y="241" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="188" dy="0">INTERFACE WEB</tspan>
</text>
<text x="345" y="241" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="345" dy="0">Next.js • React • TypeScript • Tailwind CSS</tspan>
</text>
<line x1="540" y1="285" x2="540" y2="310" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="65" y="315" width="950" height="105" rx="18" fill="#FFFFFF" stroke="#218C74" stroke-width="2"/>
<rect x="65" y="315" width="245" height="105" rx="18" fill="#E9F7F3"/>
<rect x="292" y="315" width="18" height="105" fill="#E9F7F3"/>
<text x="188" y="376" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="188" dy="0">API TRANSACIONAL</tspan>
</text>
<text x="345" y="376" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="345" dy="0">Python • FastAPI • Pydantic • SQLAlchemy • Alembic</tspan>
</text>
<line x1="540" y1="420" x2="540" y2="445" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="65" y="450" width="950" height="105" rx="18" fill="#FFFFFF" stroke="#7B61A8" stroke-width="2"/>
<rect x="65" y="450" width="245" height="105" rx="18" fill="#F4EFFB"/>
<rect x="292" y="450" width="18" height="105" fill="#F4EFFB"/>
<text x="188" y="511" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="188" dy="0">RUNTIME DE AGENTES</tspan>
</text>
<text x="345" y="511" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="345" dy="0">Python • FastAPI • Strands Agents • Bedrock (modo conectado) • modo simulado</tspan>
</text>
<line x1="540" y1="555" x2="540" y2="580" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="65" y="585" width="950" height="105" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
<rect x="65" y="585" width="245" height="105" rx="18" fill="#FFF4E5"/>
<rect x="292" y="585" width="18" height="105" fill="#FFF4E5"/>
<text x="188" y="646" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="188" dy="0">DADOS E ARQUIVOS</tspan>
</text>
<text x="345" y="646" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="345" dy="0">PostgreSQL • armazenamento local • MinIO / serviço compatível com S3</tspan>
</text>
<rect x="1080" y="180" width="455" height="510" rx="22" fill="#EEF2F4" stroke="#183B56" stroke-width="3"/>
<text x="1308" y="225" font-size="22" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="1308" dy="0">OBSERVABILIDADE</tspan>
</text>
<rect x="1120" y="250" width="375" height="44" rx="22.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="1307.5" y="277.44" font-size="16" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="1307.5" dy="0">Eventos de execução</tspan>
</text>
<text x="1308" y="322" font-size="14" font-weight="400" fill="#5F7280" text-anchor="middle" font-style="normal">
<tspan x="1308" dy="0">nós • ferramentas • mensagens</tspan>
<tspan x="1308" dy="20">transferências • resposta final</tspan>
</text>
<rect x="1120" y="350" width="375" height="44" rx="22.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="1307.5" y="377.44" font-size="16" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
