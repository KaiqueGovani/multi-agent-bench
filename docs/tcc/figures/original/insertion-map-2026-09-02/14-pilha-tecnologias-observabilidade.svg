</text>
<text x="1308" y="422" font-size="14" font-weight="400" fill="#5F7280" text-anchor="middle" font-style="normal">
<tspan x="1308" dy="0">tokens • duração • ciclos</tspan>
<tspan x="1308" dy="20">desfecho • revisão humana</tspan>
</text>
<rect x="1120" y="450" width="375" height="44" rx="22.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="1307.5" y="477.44" font-size="16" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="1307.5" dy="0">Atualização da interface</tspan>
</text>
<text x="1308" y="522" font-size="14" font-weight="400" fill="#5F7280" text-anchor="middle" font-style="normal">
<tspan x="1308" dy="0">SSE • linha do tempo</tspan>
<tspan x="1308" dy="20">painel comparativo</tspan>
</text>
<rect x="1120" y="550" width="375" height="44" rx="22.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="1307.5" y="577.44" font-size="16" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="1307.5" dy="0">Exportação opcional</tspan>
</text>
<text x="1308" y="622" font-size="14" font-weight="400" fill="#5F7280" text-anchor="middle" font-style="normal">
<tspan x="1308" dy="0">OpenTelemetry / OTLP</tspan>
</text>
<line x1="1015" y1="500" x2="1070" y2="500" stroke="#183B56" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="230" y="760" width="1140" height="105" rx="18" fill="#EAF3FF" stroke="#2F80ED" stroke-width="2"/>
<text x="800" y="802" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="800" dy="0">Somente sinais técnicos e dados sanitizados devem integrar evidências públicas.</tspan>
<tspan x="800" dy="32">Conversas reais, identificadores, credenciais e dados de saúde permanecem fora do repositório.</tspan>
</text>
<line x1="58" y1="944" x2="1542" y2="944" stroke="#D6E0E5" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="972" font-size="14" font-weight="400" fill="#5F7280" text-anchor="start" font-style="normal">
<tspan x="58" dy="0">Elaboração própria (2026) — candidato para revisão editorial.</tspan>
</text>
</svg>
