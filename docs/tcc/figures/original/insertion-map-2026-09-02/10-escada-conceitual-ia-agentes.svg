<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Da resposta automática ao sistema multiagente</title>
<desc id="desc">Escada conceitual de chatbot baseado em regras, LLM, agente e sistema multiagente.</desc>
<defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#536B7A"/>
              </marker>
              <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F80ED"/>
              </marker>
              <style>
                text { font-family: Arial, Helvetica, sans-serif; }
                .title { font-size: 38px; font-weight: 700; fill: #183B56; }
                .subtitle { font-size: 20px; fill: #5F7280; }
                .label { font-size: 22px; font-weight: 700; }
                .body { font-size: 18px; }
                .small { font-size: 15px; }
                .tiny { font-size: 13px; }
              </style>
            </defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="58" y="42" width="10" height="52" rx="5" fill="#2F80ED"/>
<text x="88" y="78" class="title">Da resposta automática ao sistema multiagente</text>
<text x="88" y="112" class="subtitle">Cada nível acrescenta capacidades e também novas responsabilidades arquiteturais.</text>
<rect x="75" y="660" width="320" height="210" rx="22" fill="#EEF2F4" stroke="#5F7280" stroke-width="3"/>
<text x="103" y="708" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="103" dy="0">1  CHATBOT</tspan>
</text>
<text x="103" y="752" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="103" dy="0">regras e respostas</tspan>
<tspan x="103" dy="31">predefinidas</tspan>
<tspan x="103" dy="31">baixo grau de ação</tspan>
</text>
<rect x="425" y="520" width="320" height="350" rx="22" fill="#EAF3FF" stroke="#2F80ED" stroke-width="3"/>
<text x="453" y="568" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="453" dy="0">2  MODELO DE LINGUAGEM</tspan>
</text>
<text x="453" y="612" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="453" dy="0">interpreta linguagem</tspan>
<tspan x="453" dy="31">gera texto</tspan>
<tspan x="453" dy="31">não age sozinho</tspan>
</text>
<rect x="775" y="380" width="320" height="490" rx="22" fill="#E9F7F3" stroke="#218C74" stroke-width="3"/>
<text x="803" y="428" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="803" dy="0">3  AGENTE</tspan>
</text>
<text x="803" y="472" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="803" dy="0">objetivo e instruções</tspan>
<tspan x="803" dy="31">memória ou estado</tspan>
<tspan x="803" dy="31">seleção de ferramentas</tspan>
<tspan x="803" dy="31">observa e continua</tspan>
</text>
<rect x="1125" y="240" width="400" height="630" rx="22" fill="#F4EFFB" stroke="#7B61A8" stroke-width="3"/>
<text x="1153" y="288" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="1153" dy="0">4  SISTEMA MULTIAGENTE</tspan>
</text>
<text x="1153" y="332" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="1153" dy="0">múltiplos papéis</tspan>
<tspan x="1153" dy="31">comunicação</tspan>
<tspan x="1153" dy="31">coordenação</tspan>
<tspan x="1153" dy="31">estado compartilhado</tspan>
<tspan x="1153" dy="31">regras de parada</tspan>
<tspan x="1153" dy="31">telemetria</tspan>
</text>
<line x1="395" y1="710" x2="420" y2="650" stroke="#183B56" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="745" y1="570" x2="770" y2="510" stroke="#183B56" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1095" y1="430" x2="1120" y2="370" stroke="#183B56" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="800" y="190" font-size="20" font-weight="700" fill="#5F7280" text-anchor="middle" font-style="normal">
<tspan x="800" dy="0">crescem autonomia, integração e custo de coordenação</tspan>
</text>
<line x1="420" y1="205" x2="1180" y2="205" stroke="#5F7280" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="58" y1="944" x2="1542" y2="944" stroke="#D6E0E5" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="972" font-size="14" font-weight="400" fill="#5F7280" text-anchor="start" font-style="normal">
<tspan x="58" dy="0">Elaboração própria (2026) — candidato para revisão editorial.</tspan>
</text>
</svg>
