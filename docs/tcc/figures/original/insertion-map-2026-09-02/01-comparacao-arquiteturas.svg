<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Comparação entre arquiteturas de coordenação</title>
<desc id="desc">Comparação visual entre orquestração centralizada, fluxo estruturado e coordenação descentralizada.</desc>
<defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#536B7A"/>
              </marker>
              <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F80ED"/>
              </marker>
              <style>
                text { font-family: Arial, Helvetica, sans-serif; }
                .title { font-size: 38px; font-weight: 700; fill: #183B56; }
                .subtitle { font-size: 20px; fill: #5F7280; }
                .label { font-size: 22px; font-weight: 700; }
                .body { font-size: 18px; }
                .small { font-size: 15px; }
                .tiny { font-size: 13px; }
              </style>
            </defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="58" y="42" width="10" height="52" rx="5" fill="#2F80ED"/>
<text x="88" y="78" class="title">Comparação entre arquiteturas de coordenação</text>
<text x="88" y="112" class="subtitle">Mesma tarefa, agentes e ferramentas; muda apenas a forma de coordenar.</text>
<rect x="610" y="132" width="380" height="54" rx="27.0" fill="#EEF2F4" stroke="#183B56" stroke-width="2"/>
<text x="800.0" y="165.12" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="800.0" dy="0">Tarefa comum de atendimento</tspan>
</text>
<rect x="65" y="215" width="450" height="680" rx="22" fill="#FFFFFF" stroke="#2F80ED" stroke-width="3"/>
<rect x="65" y="215" width="450" height="72" rx="22" fill="#EAF3FF"/>
<rect x="65" y="265" width="450" height="22" fill="#EAF3FF"/>
<text x="290" y="260" font-size="20" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="290" dy="0">ORQUESTRAÇÃO CENTRALIZADA</tspan>
</text>
<rect x="575" y="215" width="450" height="680" rx="22" fill="#FFFFFF" stroke="#218C74" stroke-width="3"/>
<rect x="575" y="215" width="450" height="72" rx="22" fill="#E9F7F3"/>
<rect x="575" y="265" width="450" height="22" fill="#E9F7F3"/>
<text x="800" y="260" font-size="20" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="800" dy="0">FLUXO ESTRUTURADO</tspan>
</text>
<rect x="1085" y="215" width="450" height="680" rx="22" fill="#FFFFFF" stroke="#7B61A8" stroke-width="3"/>
<rect x="1085" y="215" width="450" height="72" rx="22" fill="#F4EFFB"/>
<rect x="1085" y="265" width="450" height="22" fill="#F4EFFB"/>
<text x="1310" y="260" font-size="20" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="1310" dy="0">COORDENAÇÃO DESCENTRALIZADA</tspan>
</text>
<rect x="190" y="318" width="200" height="48" rx="24.0" fill="#EAF3FF" stroke="#2F80ED" stroke-width="2"/>
<text x="290.0" y="348.12" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="290.0" dy="0">Supervisor</tspan>
</text>
<line x1="290" y1="366" x2="290" y2="415" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="92" y="425" width="110" height="70" rx="14" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="147" y="468" font-size="17" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="147" dy="0">FAQ</tspan>
</text>
<rect x="220" y="425" width="110" height="70" rx="14" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="275" y="468" font-size="17" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="275" dy="0">Estoque</tspan>
</text>
<rect x="348" y="425" width="110" height="70" rx="14" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="403" y="468" font-size="17" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="403" dy="0">Anexos</tspan>
</text>
<line x1="290" y1="495" x2="290" y2="545" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="165" y="555" width="250" height="48" rx="24.0" fill="#ECF7EC" stroke="#2E7D32" stroke-width="2"/>
<text x="290.0" y="585.12" font-size="18" font-weight="700" fill="#2E7D32" text-anchor="middle" font-style="normal">
<tspan x="290.0" dy="0">Resposta final</tspan>
</text>
<text x="95" y="665" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="95" dy="0">Quem decide: supervisor</tspan>
<tspan x="95" dy="34">Fluxo: adaptado pelo supervisor</tspan>
<tspan x="95" dy="34">Estado: concentrado</tspan>
<tspan x="95" dy="34">Rastreio: ponto central</tspan>
</text>
<rect x="620" y="318" width="360" height="52" rx="26.0" fill="#E9F7F3" stroke="#218C74" stroke-width="2"/>
<text x="800.0" y="350.12" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="800.0" dy="0">1  Classificar</tspan>
</text>
<line x1="800" y1="370" x2="800" y2="402" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="620" y="410" width="360" height="52" rx="26.0" fill="#E9F7F3" stroke="#218C74" stroke-width="2"/>
<text x="800.0" y="442.12" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="800.0" dy="0">2  Coletar evidência</tspan>
</text>
<line x1="800" y1="462" x2="800" y2="494" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="620" y="502" width="360" height="52" rx="26.0" fill="#E9F7F3" stroke="#218C74" stroke-width="2"/>
<text x="800.0" y="534.12" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="800.0" dy="0">3  Revisar</tspan>
</text>
<line x1="800" y1="554" x2="800" y2="586" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="620" y="594" width="360" height="52" rx="26.0" fill="#E9F7F3" stroke="#218C74" stroke-width="2"/>
<text x="800.0" y="626.12" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="800.0" dy="0">4  Sintetizar</tspan>
</text>
<text x="605" y="735" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="605" dy="0">Quem decide: etapas e regras</tspan>
<tspan x="605" dy="34">Fluxo: previamente definido</tspan>
<tspan x="605" dy="34">Estado: passa entre estágios</tspan>
<tspan x="605" dy="34">Rastreio: por etapa</tspan>
</text>
<rect x="1215" y="310" width="190" height="46" rx="23.0" fill="#F4EFFB" stroke="#7B61A8" stroke-width="2"/>
<text x="1310.0" y="339.12" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="1310.0" dy="0">Coordenador</tspan>
</text>
<circle cx="1145" cy="440" r="54" fill="#F4EFFB" stroke="#7B61A8" stroke-width="2"/>
<text x="1145" y="446" font-size="16" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="1145" dy="0">FAQ</tspan>
</text>
<circle cx="1310" cy="410" r="54" fill="#F4EFFB" stroke="#7B61A8" stroke-width="2"/>
<text x="1310" y="416" font-size="16" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="1310" dy="0">Estoque</tspan>
</text>
<circle cx="1425" cy="500" r="54" fill="#F4EFFB" stroke="#7B61A8" stroke-width="2"/>
<text x="1425" y="506" font-size="16" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="1425" dy="0">Anexos</tspan>
</text>
<line x1="1280" y1="356" x2="1165" y2="397" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1310" y1="356" x2="1310" y2="356" stroke="#536B7A" stroke-width="3" stroke-linecap="round"/>
<path d="M 1310 356 Q 1350 375 1325 390" fill="none" stroke="#536B7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1345 438 Q 1390 440 1405 470" fill="none" stroke="#536B7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1385 520 Q 1275 560 1195 475" fill="none" stroke="#536B7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="1210" y="590" width="200" height="46" rx="23.0" fill="#ECF7EC" stroke="#2E7D32" stroke-width="2"/>
<text x="1310.0" y="619.12" font-size="18" font-weight="700" fill="#2E7D32" text-anchor="middle" font-style="normal">
<tspan x="1310.0" dy="0">Síntese final</tspan>
</text>
<line x1="1330" y1="545" x2="1320" y2="585" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1115" y="735" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="1115" dy="0">Quem decide: agentes locais</tspan>
<tspan x="1115" dy="34">Fluxo: transferências entre pares</tspan>
<tspan x="1115" dy="34">Estado: circula com a tarefa</tspan>
<tspan x="1115" dy="34">Rastreio: mensagens e transferências</tspan>
</text>
<line x1="58" y1="944" x2="1542" y2="944" stroke="#D6E0E5" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="972" font-size="14" font-weight="400" fill="#5F7280" text-anchor="start" font-style="normal">
<tspan x="58" dy="0">Elaboração própria (2026) — candidato para revisão editorial.</tspan>
</text>
</svg>
