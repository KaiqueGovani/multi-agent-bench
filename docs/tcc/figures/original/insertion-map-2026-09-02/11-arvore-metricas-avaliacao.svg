<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Dimensões e métricas de avaliação</title>
<desc id="desc">Árvore de métricas planejadas para a comparação das arquiteturas.</desc>
<defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#536B7A"/>
              </marker>
              <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F80ED"/>
              </marker>
              <style>
                text { font-family: Arial, Helvetica, sans-serif; }
                .title { font-size: 38px; font-weight: 700; fill: #183B56; }
                .subtitle { font-size: 20px; fill: #5F7280; }
                .label { font-size: 22px; font-weight: 700; }
                .body { font-size: 18px; }
                .small { font-size: 15px; }
                .tiny { font-size: 13px; }
              </style>
            </defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="58" y="42" width="10" height="52" rx="5" fill="#2F80ED"/>
<text x="88" y="78" class="title">Dimensões e métricas de avaliação</text>
<text x="88" y="112" class="subtitle">O protocolo separa desempenho, coordenação, qualidade e segurança.</text>
<rect x="600" y="155" width="400" height="62" rx="31.0" fill="#EEF2F4" stroke="#183B56" stroke-width="2"/>
<text x="800.0" y="192.8" font-size="20" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="800.0" dy="0">AVALIAÇÃO DAS ARQUITETURAS</tspan>
</text>
<line x1="800" y1="217" x2="800" y2="270" stroke="#183B56" stroke-width="3" stroke-linecap="round"/>
<line x1="235" y1="270" x2="1365" y2="270" stroke="#183B56" stroke-width="3" stroke-linecap="round"/>
<line x1="215" y1="270" x2="215" y2="315" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="55" y="325" width="320" height="430" rx="18" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<rect x="55" y="325" width="320" height="58" rx="18" fill="#EAF3FF"/>
<rect x="55" y="365" width="320" height="18" fill="#EAF3FF"/>
<text x="75" y="362" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="75" dy="0">DESEMPENHO</tspan>
</text>
<text x="77" y="407" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="77" dy="0">sucesso técnico</tspan>
<tspan x="77" dy="27">latência: p50 e p95</tspan>
<tspan x="77" dy="27">erros de execução</tspan>
<tspan x="77" dy="27">erros de ferramenta</tspan>
</text>
<line x1="605" y1="270" x2="605" y2="315" stroke="#7B61A8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="445" y="325" width="320" height="430" rx="18" fill="#FFFFFF" stroke="#7B61A8" stroke-width="2"/>
<rect x="445" y="325" width="320" height="58" rx="18" fill="#F4EFFB"/>
<rect x="445" y="365" width="320" height="18" fill="#F4EFFB"/>
<text x="465" y="362" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="465" dy="0">COORDENAÇÃO</tspan>
</text>
<text x="467" y="407" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="467" dy="0">tokens</tspan>
<tspan x="467" dy="27">chamadas de ferramenta</tspan>
<tspan x="467" dy="27">transferências e ciclos</tspan>
<tspan x="467" dy="27">etapas ou agentes</tspan>
<tspan x="467" dy="27">tempo total</tspan>
</text>
<line x1="995" y1="270" x2="995" y2="315" stroke="#218C74" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="835" y="325" width="320" height="430" rx="18" fill="#FFFFFF" stroke="#218C74" stroke-width="2"/>
<rect x="835" y="325" width="320" height="58" rx="18" fill="#E9F7F3"/>
<rect x="835" y="365" width="320" height="18" fill="#E9F7F3"/>
<text x="855" y="362" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="855" dy="0">QUALIDADE</tspan>
</text>
<text x="857" y="407" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="857" dy="0">aderência à intenção</tspan>
<tspan x="857" dy="27">correção operacional</tspan>
<tspan x="857" dy="27">completude</tspan>
<tspan x="857" dy="27">clareza</tspan>
<tspan x="857" dy="27">rubrica de 1 a 5</tspan>
</text>
<line x1="1385" y1="270" x2="1385" y2="315" stroke="#C84B4B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1225" y="325" width="320" height="430" rx="18" fill="#FFFFFF" stroke="#C84B4B" stroke-width="2"/>
<rect x="1225" y="325" width="320" height="58" rx="18" fill="#FDEEEE"/>
<rect x="1225" y="365" width="320" height="18" fill="#FDEEEE"/>
<text x="1245" y="362" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="1245" dy="0">SEGURANÇA</tspan>
</text>
<text x="1247" y="407" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="1247" dy="0">encaminhamento correto</tspan>
<tspan x="1247" dy="27">falsos negativos</tspan>
<tspan x="1247" dy="27">sensibilidade</tspan>
<tspan x="1247" dy="27">especificidade</tspan>
<tspan x="1247" dy="27">revisão humana</tspan>
</text>
<rect x="250" y="800" width="1100" height="90" rx="18" fill="#EEF2F4" stroke="#C8D4DB" stroke-width="1"/>
<text x="800" y="842" font-size="18" font-weight="700" fill="#5F7280" text-anchor="middle" font-style="normal">
<tspan x="800" dy="0">Sucesso técnico não equivale a resposta correta.</tspan>
<tspan x="800" dy="30">As dimensões serão reportadas separadamente; esta figura não contém resultados.</tspan>
</text>
<line x1="58" y1="944" x2="1542" y2="944" stroke="#D6E0E5" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="972" font-size="14" font-weight="400" fill="#5F7280" text-anchor="start" font-style="normal">
<tspan x="58" dy="0">Elaboração própria (2026) — candidato para revisão editorial.</tspan>
</text>
</svg>
