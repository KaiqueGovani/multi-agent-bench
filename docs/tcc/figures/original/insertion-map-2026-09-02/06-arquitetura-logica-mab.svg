<tspan x="278" dy="0">RUNTIME COMUM</tspan>
<tspan x="278" dy="24">DE AGENTES</tspan>
</text>
<rect x="160" y="725" width="1280" height="100" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
<rect x="160" y="725" width="235" height="100" rx="18" fill="#FFF4E5"/>
<rect x="377" y="725" width="18" height="100" fill="#FFF4E5"/>
<text x="278" y="768.0" font-size="17" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
