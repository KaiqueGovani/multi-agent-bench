<text x="278" y="222.0" font-size="17" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="278" dy="0">INTERAÇÃO</tspan>
</text>
<text x="435" y="203.0" font-size="18" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="435" dy="0">Interface web</tspan>
<tspan x="435" dy="30">chat • histórico • painéis • revisão</tspan>
</text>
<line x1="800" y1="280" x2="800" y2="305" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
