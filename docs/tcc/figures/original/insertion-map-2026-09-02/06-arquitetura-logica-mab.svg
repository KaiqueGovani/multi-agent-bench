<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura lógica do MAB</title>
<desc id="desc">Arquitetura em camadas do sistema MAB com interface, API, runtime, ferramentas, persistência e telemetria.</desc>
<defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#536B7A"/>
              </marker>
              <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F80ED"/>
              </marker>
              <style>
                text { font-family: Arial, Helvetica, sans-serif; }
                .title { font-size: 38px; font-weight: 700; fill: #183B56; }
                .subtitle { font-size: 20px; fill: #5F7280; }
                .label { font-size: 22px; font-weight: 700; }
                .body { font-size: 18px; }
                .small { font-size: 15px; }
                .tiny { font-size: 13px; }
              </style>
            </defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="58" y="42" width="10" height="52" rx="5" fill="#2F80ED"/>
<text x="88" y="78" class="title">Arquitetura lógica do MAB</text>
<text x="88" y="112" class="subtitle">Camadas comuns sustentam três estratégias intercambiáveis de coordenação.</text>
<rect x="160" y="150" width="1280" height="130" rx="18" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
