<tspan x="435" dy="30">estoque</tspan>
<tspan x="435" dy="30">anexos</tspan>
</text>
<line x1="800" y1="825" x2="800" y2="850" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="160" y="855" width="1280" height="70" rx="18" fill="#FFFFFF" stroke="#183B56" stroke-width="2"/>
<rect x="160" y="855" width="235" height="70" rx="18" fill="#EEF2F4"/>
<rect x="377" y="855" width="18" height="70" fill="#EEF2F4"/>
<text x="278" y="897.0" font-size="17" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
