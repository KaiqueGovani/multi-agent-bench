<tspan x="278" dy="0">API TRANSACIONAL</tspan>
</text>
<text x="435" y="363.0" font-size="18" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="435" dy="0">conversas • mensagens • anexos • execuções</tspan>
<tspan x="435" dy="30">normalização • persistência • eventos SSE</tspan>
</text>
<line x1="800" y1="440" x2="800" y2="465" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
