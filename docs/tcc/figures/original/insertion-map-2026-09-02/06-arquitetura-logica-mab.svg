</text>
<text x="900" y="650" font-size="14" font-weight="400" fill="#5F7280" text-anchor="middle" font-style="normal">
<tspan x="900" dy="0">fluxo estruturado</tspan>
</text>
<text x="1220" y="650" font-size="14" font-weight="400" fill="#5F7280" text-anchor="middle" font-style="normal">
<tspan x="1220" dy="0">coordenação descentralizada</tspan>
</text>
<line x1="58" y1="944" x2="1542" y2="944" stroke="#D6E0E5" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="972" font-size="14" font-weight="400" fill="#5F7280" text-anchor="start" font-style="normal">
