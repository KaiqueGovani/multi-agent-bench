<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Base funcional e configurações comparadas no MAB</title><desc id="desc">Diagrama autoral em português. Base funcional e configurações comparadas no MAB.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><rect width="1200" height="650" fill="white"/><rect x="25" y="20" width="505" height="555" rx="5" fill="#ffffff" stroke="#c1c8d0" stroke-width="2"/><rect x="575" y="20" width="600" height="555" rx="5" fill="#ffffff" stroke="#c1c8d0" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif" fill="#17212b"><text x="277.5" y="62" font-size="29" font-weight="700" text-anchor="middle"><tspan x="277.5" dy="0">Base funcional comum</tspan></text><text x="70" y="120" font-size="29" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Cenários e entradas</tspan></text><text x="70" y="205" font-size="29" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Modelo de linguagem</tspan></text><text x="70" y="290" font-size="29" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Ferramentas de domínio</tspan></text><text x="70" y="375" font-size="29" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Formato de entrada e saída</tspan></text><text x="70" y="460" font-size="29" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Critérios de avaliação</tspan></text><text x="875.0" y="62" font-size="29" font-weight="700" text-anchor="middle"><tspan x="875.0" dy="0">Configurações de coordenação</tspan></text><rect x="600" y="95" width="550" height="120" rx="5" fill="#f4f6f8" stroke="#334155" stroke-width="2"/><text x="875.0" y="145.955" font-size="27" font-weight="400" text-anchor="middle"><tspan x="875.0" dy="0">Centralizada</tspan><tspan x="875.0" dy="36.45">Um agente com ferramentas</tspan></text><rect x="600" y="250" width="550" height="120" rx="5" fill="#f4f6f8" stroke="#334155" stroke-width="2"/><text x="875.0" y="300.955" font-size="27" font-weight="400" text-anchor="middle"><tspan x="875.0" dy="0">Workflow</tspan><tspan x="875.0" dy="36.45">Agentes em etapas definidas</tspan></text><rect x="600" y="405" width="550" height="120" rx="5" fill="#f4f6f8" stroke="#334155" stroke-width="2"/><text x="875.0" y="455.955" font-size="27" font-weight="400" text-anchor="middle"><tspan x="875.0" dy="0">Swarm</tspan><tspan x="875.0" dy="36.45">Agentes com transferências entre pares</tspan></text><text x="600" y="625" font-size="28" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">A distribuição de funções e o número de agentes também diferem.</tspan></text></g></svg>