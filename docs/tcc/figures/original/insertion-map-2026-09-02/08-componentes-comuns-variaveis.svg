<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">O que permanece constante e o que varia</title>
<desc id="desc">Separação entre componentes comuns e módulos variáveis das três implementações.</desc>
<defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#536B7A"/>
              </marker>
              <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F80ED"/>
              </marker>
              <style>
                text { font-family: Arial, Helvetica, sans-serif; }
                .title { font-size: 38px; font-weight: 700; fill: #183B56; }
                .subtitle { font-size: 20px; fill: #5F7280; }
                .label { font-size: 22px; font-weight: 700; }
                .body { font-size: 18px; }
                .small { font-size: 15px; }
                .tiny { font-size: 13px; }
              </style>
            </defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="58" y="42" width="10" height="52" rx="5" fill="#2F80ED"/>
<text x="88" y="78" class="title">O que permanece constante e o que varia</text>
<text x="88" y="112" class="subtitle">A comparação controla a base funcional e altera o módulo de coordenação.</text>
<rect x="70" y="180" width="480" height="700" rx="24" fill="#EAF3FF" stroke="#2F80ED" stroke-width="3"/>
<text x="310" y="230" font-size="22" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="310" dy="0">BASE COMUM CONTROLADA</tspan>
</text>
<rect x="120" y="275" width="380" height="52" rx="26.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="310.0" y="306.78" font-size="17" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="310.0" dy="0">Cenários e entradas</tspan>
</text>
<rect x="120" y="353" width="380" height="52" rx="26.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="310.0" y="384.78" font-size="17" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="310.0" dy="0">Modelo e parâmetros</tspan>
</text>
<rect x="120" y="431" width="380" height="52" rx="26.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="310.0" y="462.78" font-size="17" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="310.0" dy="0">Instruções de domínio</tspan>
</text>
<rect x="120" y="509" width="380" height="52" rx="26.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="310.0" y="540.78" font-size="17" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="310.0" dy="0">Ferramentas disponíveis</tspan>
</text>
<rect x="120" y="587" width="380" height="52" rx="26.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="310.0" y="618.78" font-size="17" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="310.0" dy="0">Contratos de entrada e saída</tspan>
</text>
<rect x="120" y="665" width="380" height="52" rx="26.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="310.0" y="696.78" font-size="17" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="310.0" dy="0">Limites operacionais</tspan>
</text>
<rect x="120" y="743" width="380" height="52" rx="26.0" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<text x="310.0" y="774.78" font-size="17" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="310.0" dy="0">Eventos e métricas</tspan>
</text>
<line x1="550" y1="530" x2="670" y2="530" stroke="#183B56" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="680" y="180" width="850" height="700" rx="24" fill="#FFFFFF" stroke="#183B56" stroke-width="3"/>
<text x="1105" y="230" font-size="22" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="1105" dy="0">MÓDULO DE COORDENAÇÃO VARIÁVEL</tspan>
</text>
<rect x="730" y="285" width="220" height="310" rx="18" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<rect x="730" y="285" width="220" height="58" rx="18" fill="#EAF3FF"/>
<rect x="730" y="325" width="220" height="18" fill="#EAF3FF"/>
<text x="750" y="322" font-size="16" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="750" dy="0">ORQUESTRAÇÃO</tspan>
</text>
<text x="752" y="367" font-size="15" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="752" dy="0">um supervisor</tspan>
<tspan x="752" dy="27">decide rota e ferramentas</tspan>
<tspan x="752" dy="27">sem transferência</tspan>
<tspan x="752" dy="27">entre pares</tspan>
</text>
<rect x="1000" y="285" width="220" height="310" rx="18" fill="#FFFFFF" stroke="#218C74" stroke-width="2"/>
<rect x="1000" y="285" width="220" height="58" rx="18" fill="#E9F7F3"/>
<rect x="1000" y="325" width="220" height="18" fill="#E9F7F3"/>
<text x="1020" y="322" font-size="16" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="1020" dy="0">FLUXO ESTRUTURADO</tspan>
</text>
<text x="1022" y="367" font-size="15" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="1022" dy="0">classificar → evidência</tspan>
<tspan x="1022" dy="27">→ revisão → síntese</tspan>
<tspan x="1022" dy="27">ordem previsível</tspan>
</text>
<rect x="1270" y="285" width="220" height="310" rx="18" fill="#FFFFFF" stroke="#7B61A8" stroke-width="2"/>
<rect x="1270" y="285" width="220" height="58" rx="18" fill="#F4EFFB"/>
<rect x="1270" y="325" width="220" height="18" fill="#F4EFFB"/>
<text x="1290" y="322" font-size="16" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="1290" dy="0">DESCENTRALIZADA</tspan>
</text>
<text x="1292" y="367" font-size="15" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="1292" dy="0">coordenador inicia</tspan>
<tspan x="1292" dy="27">especialistas transferem</tspan>
<tspan x="1292" dy="27">limite de transferências</tspan>
</text>
<rect x="845" y="665" width="520" height="58" rx="29.0" fill="#ECF7EC" stroke="#2E7D32" stroke-width="2"/>
<text x="1105.0" y="700.12" font-size="18" font-weight="700" fill="#2E7D32" text-anchor="middle" font-style="normal">
<tspan x="1105.0" dy="0">Saída comum: resposta + desfecho + evidências</tspan>
</text>
<line x1="840" y1="595" x2="1105" y2="660" stroke="#536B7A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1110" y1="595" x2="1105" y2="660" stroke="#536B7A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1380" y1="595" x2="1105" y2="660" stroke="#536B7A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1105" y="790" font-size="18" font-weight="700" fill="#5F7280" text-anchor="middle" font-style="normal">
<tspan x="1105" dy="0">Variável independente: arquitetura de coordenação</tspan>
<tspan x="1105" dy="34">Nenhuma superioridade é presumida antes dos experimentos</tspan>
</text>
<line x1="58" y1="944" x2="1542" y2="944" stroke="#D6E0E5" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="972" font-size="14" font-weight="400" fill="#5F7280" text-anchor="start" font-style="normal">
<tspan x="58" dy="0">Elaboração própria (2026) — candidato para revisão editorial.</tspan>
</text>
</svg>
