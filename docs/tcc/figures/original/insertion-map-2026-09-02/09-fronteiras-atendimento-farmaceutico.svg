ário, entrega ou disponibilidade</tspan></text><rect x="660" y="370" width="510" height="140" rx="5" fill="#f4f6f8" stroke="#334155" stroke-width="2"/><text x="915.0" y="430.62" font-size="28" font-weight="400" text-anchor="middle"><tspan x="915.0" dy="0">Encaminhamento profissional</tspan><tspan x="915.0" dy="37.800000000000004">Avaliação por farmacêutico</tspan></text><text x="600" y="595" font-size="25" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Fluxo conceitual do escopo; não representa validação clínica do sistema.</tspan></text></g></svg>