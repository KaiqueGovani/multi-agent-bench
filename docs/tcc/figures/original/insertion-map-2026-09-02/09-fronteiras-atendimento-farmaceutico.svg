<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Fronteiras do atendimento no estudo de caso</title>
<desc id="desc">Mapa de limites entre atendimento operacional, salvaguardas, revisão humana e encaminhamento.</desc>
<defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#536B7A"/>
              </marker>
              <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F80ED"/>
              </marker>
              <style>
                text { font-family: Arial, Helvetica, sans-serif; }
                .title { font-size: 38px; font-weight: 700; fill: #183B56; }
                .subtitle { font-size: 20px; fill: #5F7280; }
                .label { font-size: 22px; font-weight: 700; }
                .body { font-size: 18px; }
                .small { font-size: 15px; }
                .tiny { font-size: 13px; }
              </style>
            </defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="58" y="42" width="10" height="52" rx="5" fill="#2F80ED"/>
<text x="88" y="78" class="title">Fronteiras do atendimento no estudo de caso</text>
<text x="88" y="112" class="subtitle">A automação apoia tarefas operacionais; situações sensíveis permanecem sob responsabilidade profissional.</text>
<rect x="70" y="205" width="450" height="270" rx="18" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<rect x="70" y="205" width="450" height="58" rx="18" fill="#ECF7EC"/>
<rect x="70" y="245" width="450" height="18" fill="#ECF7EC"/>
<text x="90" y="242" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="90" dy="0">AUTOMAÇÃO OPERACIONAL</tspan>
</text>
<text x="92" y="287" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="92" dy="0">horário, entrega e devolução</tspan>
<tspan x="92" dy="27">consulta de disponibilidade</tspan>
<tspan x="92" dy="27">triagem inicial de anexos</tspan>
<tspan x="92" dy="27">recuperação de informação institucional</tspan>
</text>
<rect x="575" y="205" width="450" height="270" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
<rect x="575" y="205" width="450" height="58" rx="18" fill="#FFF4E5"/>
<rect x="575" y="245" width="450" height="18" fill="#FFF4E5"/>
<text x="595" y="242" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="595" dy="0">SALVAGUARDAS</tspan>
</text>
<text x="597" y="287" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="597" dy="0">linguagem ambígua</tspan>
<tspan x="597" dy="27">contexto insuficiente</tspan>
<tspan x="597" dy="27">conteúdo sensível</tspan>
<tspan x="597" dy="27">identificação de necessidade de revisão</tspan>
</text>
<rect x="1080" y="205" width="450" height="270" rx="18" fill="#FFFFFF" stroke="#C84B4B" stroke-width="2"/>
<rect x="1080" y="205" width="450" height="58" rx="18" fill="#FDEEEE"/>
<rect x="1080" y="245" width="450" height="18" fill="#FDEEEE"/>
<text x="1100" y="242" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="1100" dy="0">REVISÃO PROFISSIONAL</tspan>
</text>
<text x="1102" y="287" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="1102" dy="0">avaliação por farmacêutico</tspan>
<tspan x="1102" dy="27">orientação clínica</tspan>
<tspan x="1102" dy="27">validação de segurança</tspan>
<tspan x="1102" dy="27">decisão sobre encaminhamento</tspan>
</text>
<line x1="520" y1="340" x2="565" y2="340" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1025" y1="340" x2="1070" y2="340" stroke="#C84B4B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="230" y="565" width="1140" height="220" rx="22" fill="#EEF2F4" stroke="#183B56" stroke-width="2"/>
<text x="800" y="610" font-size="22" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="800" dy="0">LIMITES EXPLÍCITOS DO SISTEMA</tspan>
</text>
<text x="800" y="662" font-size="20" font-weight="600" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="800" dy="0">não diagnosticar  •  não prescrever  •  não fornecer dosagem específica</tspan>
<tspan x="800" dy="42">não substituir o farmacêutico  •  encaminhar quando a resposta autônoma for inadequada</tspan>
</text>
<rect x="535" y="825" width="530" height="52" rx="26.0" fill="#EAF3FF" stroke="#2F80ED" stroke-width="2"/>
<text x="800.0" y="856.78" font-size="17" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="800.0" dy="0">A farmácia é o estudo de caso, não o objeto central</tspan>
</text>
<line x1="58" y1="944" x2="1542" y2="944" stroke="#D6E0E5" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="972" font-size="14" font-weight="400" fill="#5F7280" text-anchor="start" font-style="normal">
<tspan x="58" dy="0">Elaboração própria (2026) — candidato para revisão editorial.</tspan>
</text>
</svg>
