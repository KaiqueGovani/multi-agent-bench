.0" y="114.52" font-size="28" font-weight="400" text-anchor="middle"><tspan x="1000.0" dy="0">Resposta</tspan></text><rect x="455" y="255" width="245" height="90" rx="5" fill="#f4f6f8" stroke="#334155" stroke-width="2"/><text x="577.5" y="290.62" font-size="28" font-weight="400" text-anchor="middle"><tspan x="577.5" dy="0">Chamada de</tspan><tspan x="577.5" dy="37.800000000000004">ferramenta</tspan></text><rect x="830" y="255" width="330" height="90" rx="5" fill="#f4f6f8" stroke="#334155" stroke-width="2"/><text x="995.0" y="290.62" font-size="28" font-weight="400" text-anchor="middle"><tspan x="995.0" dy="0">Aplicação valida</tspan><tspan x="995.0" dy="37.800000000000004">e executa a chamada</tspan></text><rect x="830" y="465" width="330" height="90" rx="5" fill="#f4f6f8" stroke="#334155" stroke-width="2"/><text x="995.0" y="519.52" font-size="28" font-weight="400" text-anchor="middle"><tspan x="995.0" dy="0">Resultado ou erro</tspan></text><rect x="385" y="465" width="330" height="90" rx="5" fill="#f4f6f8" stroke="#334155" stroke-width="2"/><text x="550.0" y="500.62" font-size="28" font-weight="400" text-anchor="middle"><tspan x="550.0" dy="0">Atualização</tspan><tspan x="550.0" dy="37.800000000000004">do contexto</tspan></text><text x="600" y="630" font-size="28" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">O ciclo continua até a resposta ou um limite de execução.</tspan></text></g></svg>