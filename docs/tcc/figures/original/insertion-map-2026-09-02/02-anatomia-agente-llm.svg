<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Anatomia de um agente baseado em LLM</title>
<desc id="desc">Ciclo entre contexto, decisão do modelo, ferramenta, observação e resposta.</desc>
<defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#536B7A"/>
              </marker>
              <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F80ED"/>
              </marker>
              <style>
                text { font-family: Arial, Helvetica, sans-serif; }
                .title { font-size: 38px; font-weight: 700; fill: #183B56; }
                .subtitle { font-size: 20px; fill: #5F7280; }
                .label { font-size: 22px; font-weight: 700; }
                .body { font-size: 18px; }
                .small { font-size: 15px; }
                .tiny { font-size: 13px; }
              </style>
            </defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="58" y="42" width="10" height="52" rx="5" fill="#2F80ED"/>
<text x="88" y="78" class="title">Anatomia de um agente baseado em LLM</text>
<text x="88" y="112" class="subtitle">O modelo de linguagem torna-se agente quando recebe objetivo, estado e meios de ação.</text>
<rect x="75" y="230" width="300" height="145" rx="18" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2"/>
<rect x="75" y="230" width="300" height="58" rx="18" fill="#EAF3FF"/>
<rect x="75" y="270" width="300" height="18" fill="#EAF3FF"/>
<text x="95" y="267" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="95" dy="0">Objetivo e instruções</tspan>
</text>
<text x="97" y="312" font-size="16" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="97" dy="0">papel</tspan>
<tspan x="97" dy="27">regras</tspan>
<tspan x="97" dy="27">limites</tspan>
</text>
<line x1="375" y1="302" x2="545" y2="500" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="75" y="430" width="300" height="145" rx="18" fill="#FFFFFF" stroke="#218C74" stroke-width="2"/>
<rect x="75" y="430" width="300" height="58" rx="18" fill="#E9F7F3"/>
<rect x="75" y="470" width="300" height="18" fill="#E9F7F3"/>
<text x="95" y="467" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="95" dy="0">Memória e estado</tspan>
</text>
<text x="97" y="512" font-size="16" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="97" dy="0">histórico</tspan>
<tspan x="97" dy="27">evidências</tspan>
<tspan x="97" dy="27">progresso</tspan>
</text>
<line x1="375" y1="502" x2="545" y2="500" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="75" y="630" width="300" height="145" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
<rect x="75" y="630" width="300" height="58" rx="18" fill="#FFF4E5"/>
<rect x="75" y="670" width="300" height="18" fill="#FFF4E5"/>
<text x="95" y="667" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="95" dy="0">Contexto atual</tspan>
</text>
<text x="97" y="712" font-size="16" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="97" dy="0">mensagem</tspan>
<tspan x="97" dy="27">anexos</tspan>
<tspan x="97" dy="27">metadados</tspan>
</text>
<line x1="375" y1="702" x2="545" y2="500" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="720" cy="500" r="145" fill="#EAF3FF" stroke="#2F80ED" stroke-width="4"/>
<text x="720" y="468" font-size="25" font-weight="700" fill="#243746" text-anchor="middle" font-style="normal">
<tspan x="720" dy="0">LLM</tspan>
<tspan x="720" dy="34">interpreta e</tspan>
<tspan x="720" dy="34">seleciona a ação</tspan>
</text>
<rect x="1000" y="260" width="310" height="145" rx="18" fill="#FFFFFF" stroke="#7B61A8" stroke-width="2"/>
<rect x="1000" y="260" width="310" height="58" rx="18" fill="#F4EFFB"/>
<rect x="1000" y="300" width="310" height="18" fill="#F4EFFB"/>
<text x="1020" y="297" font-size="21" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="1020" dy="0">Ferramenta</tspan>
</text>
<text x="1022" y="342" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="1022" dy="0">consulta dados</tspan>
<tspan x="1022" dy="27">executa função</tspan>
<tspan x="1022" dy="27">retorna evidência</tspan>
</text>
<line x1="865" y1="455" x2="995" y2="350" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1000" y="480" width="310" height="145" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
<rect x="1000" y="480" width="310" height="58" rx="18" fill="#FFF4E5"/>
<rect x="1000" y="520" width="310" height="18" fill="#FFF4E5"/>
<text x="1020" y="517" font-size="21" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="1020" dy="0">Observação</tspan>
</text>
<text x="1022" y="562" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="1022" dy="0">resultado estruturado</tspan>
<tspan x="1022" dy="27">erro ou ausência</tspan>
<tspan x="1022" dy="27">novo contexto</tspan>
</text>
<line x1="1155" y1="405" x2="1155" y2="475" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 1000 555 C 930 555 920 610 855 585" fill="none" stroke="#536B7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
<rect x="1000" y="700" width="310" height="125" rx="18" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<rect x="1000" y="700" width="310" height="58" rx="18" fill="#ECF7EC"/>
<rect x="1000" y="740" width="310" height="18" fill="#ECF7EC"/>
<text x="1020" y="737" font-size="20" font-weight="700" fill="#183B56" text-anchor="start" font-style="normal">
<tspan x="1020" dy="0">Resposta ou próxima ação</tspan>
</text>
<text x="1022" y="782" font-size="17" font-weight="400" fill="#243746" text-anchor="start" font-style="normal">
<tspan x="1022" dy="0">finaliza ou continua o ciclo</tspan>
</text>
<line x1="840" y1="610" x2="995" y2="750" stroke="#536B7A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="555" y="760" width="330" height="54" rx="27.0" fill="#EEF2F4" stroke="#183B56" stroke-width="2"/>
<text x="720.0" y="793.12" font-size="18" font-weight="700" fill="#183B56" text-anchor="middle" font-style="normal">
<tspan x="720.0" dy="0">Agente = LLM + contexto + ação</tspan>
</text>
<line x1="58" y1="944" x2="1542" y2="944" stroke="#D6E0E5" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="972" font-size="14" font-weight="400" fill="#5F7280" text-anchor="start" font-style="normal">
<tspan x="58" dy="0">Elaboração própria (2026) — candidato para revisão editorial.</tspan>
</text>
</svg>
