  risks:
    - "A coleta exploratória de aproximadamente 20 históricos foi planejada, mas os itens GOV-01 a GOV-10 do checklist de prontidão permanecem pendentes; o status é NO-GO até confirmação humana de autorização, consentimento ou avaliação ética aplicável, minimização, ambiente privado, anonimização, retenção e descarte."
    - "A unidade de análise, segmentação e categorias só poderão ser definidas após a caracterização exploratória e dependem da OQ-004."
    - "A quantidade final entre um ou dois farmacêuticos ainda deve ser registrada no congelamento do protocolo."
    - "Modelo exato do processador, versão do Ubuntu Server, região/perfil efetivo do Bedrock e modelo do LLM-as-Judge dependem da OQ-005."
    - "A avaliação semântica está definida no protocolo, mas ainda não está implementada no harness atual; sua aplicação depende do congelamento do julgador, da rubrica e do prompt conforme a OQ-005."
    - "O executor atual é sequencial, mas percorre cenários e arquiteturas na ordem fixa do carregador; o cronograma contrabalanceado e sua aplicação permanecem requisitos de preparação antes das 600 execuções definitivas."
    - "Os diagramas horizontais das etapas e da construção dos cenários estão corretos e legíveis, mas podem receber refinamento editorial de escala no fechamento do documento."
    - "Metadados bibliográficos não verificados devem continuar sendo reconciliados com fontes primárias nas revisões de sexta-feira."
    - "R050 e R052 foram verificadas, mas permanecem sem citação: R050 oferece suporte apenas indireto ao protocolo atual e R052 estuda viés de posição em comparações pareadas ou ordenadas, desenho diferente da rubrica por resposta do MAB."
    - "A validade externa da comparação deverá ser discutida com cautela: o protocolo usa um único estudo de caso farmacêutico e não sustenta, por si só, generalização para todos os domínios de aplicação."
    - "O mapa versionado do formatador ainda não contém regras específicas de destaque bibliográfico para R044, R057-R063; nesta execução, as regras necessárias para R059-R063 foram fornecidas ao pipeline e ao auditor somente em memória, sem alteração de código."
    - "Os novos arquivos IMG-C014 a IMG-C018 são candidatos licenciados e não estão aprovados para inserção; reproduções densas ou em inglês devem ser adaptadas ou redesenhadas antes do DOCX."
    - "Os diagramas autorais IMG-C019 a IMG-C032 foram validados visualmente, mas continuam candidatos; a seleção editorial e a inserção no manuscrito e no DOCX ainda não foram realizadas."
    - "IMG-C031 representa a cadeia de proveniência planejada e permanece condicionada ao congelamento dos parâmetros técnicos da OQ-005."
    - "Figuras de R033, R034, R041, R044 e R058 permaneceram apenas como referências conceituais porque não foi confirmada licença pública suficiente para armazenamento e adaptação."
    - "O sincronizador versionado de Markdown para DOCX está delimitado ao Capítulo 4; alterações em outros capítulos exigem substituição cirúrgica validada ou futura generalização do utilitário fora do escopo documental."

